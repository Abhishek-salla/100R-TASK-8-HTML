<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration Form</h1>
    <p>Please fill in the details below to register.</p>

    <form action="https://example.com/register" method="post">

        <!-- First Name -->
        <label for="fname">First Name:</label><br>
        <input type="text"
               id="fname"
               name="first_name"
               value="Abhishek"
               autofocus
               required>
        <br><br>

        <!-- Last Name -->
        <label for="lname">Last Name:</label><br>
        <input type="text"
               id="lname"
               name="last_name"
               required>
        <br><br>

        <!-- Email -->
        <label for="email">Email:</label><br>
        <input type="email"
               id="email"
               name="email"
               required>
        <br><br>

        <!-- Password -->
        <label for="password">Password:</label><br>
        <input type="password"
               id="password"
               name="password"
               required>
        <br><br>

        <!-- Default Submit Button -->
        <input type="submit" value="Register">

        <!-- Submit Button with formaction -->
        <input type="submit"
               value="Register as Admin"
               formaction="https://example.com/admin-register">

    </form>

</body>
</html>
